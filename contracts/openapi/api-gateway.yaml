openapi: 3.1.0
info:
  title: AI Code API Gateway
  version: 0.1.0
paths:
  /factory/status:
    get:
      operationId: getFactoryStatus
      responses:
        "200":
          description: Factory status and available capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryStatus"
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /version:
    get:
      operationId: getVersion
      responses:
        "200":
          description: Service version
          content:
            application/json:
              schema:
                type: object
                required: [name, version]
                properties:
                  name:
                    type: string
                  version:
                    type: string
components:
  schemas:
    FactoryCapability:
      type: object
      required: [id, label, status, source, summary]
      properties:
        id:
          type: string
          examples: [contracts]
        label:
          type: string
          examples: [Contract-first API]
        source:
          type: string
          examples: [contracts/openapi/api-gateway.yaml]
        status:
          type: string
          enum: [ready, planned]
        summary:
          type: string
          example: HTTP API shape is declared before runtime consumers use it.
    FactoryStatus:
      type: object
      required: [name, status, version, capabilities, nextActions]
      properties:
        name:
          type: string
          examples: [AI Code Factory]
        status:
          type: string
          enum: [ready, degraded]
        version:
          type: string
          examples: [0.1.0]
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/FactoryCapability"
        nextActions:
          type: array
          items:
            type: string
