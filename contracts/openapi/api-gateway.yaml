openapi: 3.1.0
info:
  title: AI Code API Gateway
  version: 0.1.0
paths:
  /factory/status:
    get:
      operationId: getFactoryStatus
      responses:
        "200":
          description: Factory status and available capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryStatus"
  /agent/turns:
    post:
      operationId: submitAgentTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTurnRequest"
      responses:
        "200":
          description: Agent turn result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTurnResponse"
  /execution-plans/{id}/confirm:
    post:
      operationId: confirmExecutionPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmExecutionPlanRequest"
      responses:
        "200":
          description: Execution result after confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTurnResponse"
  /execution-plans/{id}/reject:
    post:
      operationId: rejectExecutionPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected execution plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionPlan"
  /execution-plans/{id}:
    get:
      operationId: getExecutionPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Execution plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionPlan"
  /execution-ledger:
    get:
      operationId: getExecutionLedger
      responses:
        "200":
          description: Execution ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionLedgerItem"
  /calendar/events:
    get:
      operationId: getCalendarEvents
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
  /expenses:
    get:
      operationId: getExpenses
      responses:
        "200":
          description: Expense records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseRecord"
  /reminders:
    get:
      operationId: getReminders
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /version:
    get:
      operationId: getVersion
      responses:
        "200":
          description: Service version
          content:
            application/json:
              schema:
                type: object
                required: [name, version]
                properties:
                  name:
                    type: string
                  version:
                    type: string
components:
  schemas:
    FactoryCapability:
      type: object
      required: [id, label, status, source, summary]
      properties:
        id:
          type: string
          examples: [contracts]
        label:
          type: string
          examples: [Contract-first API]
        source:
          type: string
          examples: [contracts/openapi/api-gateway.yaml]
        status:
          type: string
          enum: [ready, planned]
        summary:
          type: string
          example: HTTP API shape is declared before runtime consumers use it.
    FactoryStatus:
      type: object
      required: [name, status, version, capabilities, nextActions]
      properties:
        name:
          type: string
          examples: [AI Code Factory]
        status:
          type: string
          enum: [ready, degraded]
        version:
          type: string
          examples: [0.1.0]
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/FactoryCapability"
        nextActions:
          type: array
          items:
            type: string
    AgentTurnRequest:
      type: object
      required: [input]
      properties:
        conversationId:
          type: string
        input:
          type: string
        clientContext:
          type: object
    ConfirmExecutionPlanRequest:
      type: object
      required: [confirmToken]
      properties:
        confirmToken:
          type: string
        actionIds:
          type: array
          items:
            type: string
    DomainAction:
      type: object
      required: [id, planId, domain, actionType, status, riskLevel, summary, payload]
      properties:
        id:
          type: string
        planId:
          type: string
        domain:
          type: string
          enum: [calendar, expense, reminder]
        actionType:
          type: string
        status:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high]
        summary:
          type: string
        payload:
          type: object
        result:
          type: object
    ConfirmationCard:
      type: object
      required: [id, planId, status, requiredActionIds, title, description, confirmToken]
      properties:
        id:
          type: string
        planId:
          type: string
        status:
          type: string
        requiredActionIds:
          type: array
          items:
            type: string
        title:
          type: string
        description:
          type: string
        confirmToken:
          type: string
    ExecutionPlan:
      type: object
      required: [id, conversationId, status, riskLevel, summary, decisionTraceId, actions]
      properties:
        id:
          type: string
        conversationId:
          type: string
        status:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high]
        summary:
          type: string
        decisionTraceId:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/DomainAction"
        confirmation:
          $ref: "#/components/schemas/ConfirmationCard"
    AgentTurnResponse:
      type: object
      required: [kind, conversationId]
      properties:
        kind:
          type: string
          enum: [assistant_message, clarification_request, confirmation_required, execution_result]
        conversationId:
          type: string
        message:
          type: string
        question:
          type: string
        missingFields:
          type: array
          items:
            type: string
        plan:
          $ref: "#/components/schemas/ExecutionPlan"
        structuredElements:
          type: array
          items:
            type: object
    ExecutionLedgerItem:
      type: object
      required: [id, planId, eventType, status, message, createdAt]
      properties:
        id:
          type: string
        planId:
          type: string
        actionId:
          type: string
        eventType:
          type: string
        status:
          type: string
        message:
          type: string
        createdAt:
          type: string
    CalendarEvent:
      type: object
      required: [id, title, startAt, endAt, timezone, status, sourceActionId]
      properties:
        id:
          type: string
        title:
          type: string
        startAt:
          type: string
        endAt:
          type: string
        timezone:
          type: string
        status:
          type: string
        sourceActionId:
          type: string
    ExpenseRecord:
      type: object
      required: [id, title, currency, status, sourceActionId]
      properties:
        id:
          type: string
        title:
          type: string
        amount:
          type: number
        currency:
          type: string
        occurredOn:
          type: string
        status:
          type: string
        sourceActionId:
          type: string
    Reminder:
      type: object
      required: [id, title, dueAt, status, sourceActionId]
      properties:
        id:
          type: string
        title:
          type: string
        dueAt:
          type: string
        status:
          type: string
        sourceActionId:
          type: string
