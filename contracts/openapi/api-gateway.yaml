openapi: 3.1.0
info:
  title: AI Code API Gateway
  version: 0.1.0
paths:
  /factory/status:
    get:
      operationId: getFactoryStatus
      responses:
        "200":
          description: Factory status and available capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryStatus"
  /agent/turns:
    post:
      operationId: submitAgentTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTurnRequest"
      responses:
        "200":
          description: Agent turn result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTurnResponse"
  /attachments:
    get:
      operationId: listAttachments
      parameters:
        - name: conversationId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Attachment metadata intakes for a conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttachmentIntake"
  /attachments/intake:
    post:
      operationId: intakeAttachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentIntakeRequest"
      responses:
        "200":
          description: Attachment metadata intake result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentIntake"
  /attachments/upload:
    post:
      operationId: uploadAttachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentUploadRequest"
      responses:
        "200":
          description: Attachment content upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentIntake"
  /agent/conversations/{conversationId}/debug:
    get:
      operationId: getAgentConversationDebug
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent planning debug events, decision traces, and pending clarifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConversationDebug"
  /agent/conversations/{conversationId}/turns:
    get:
      operationId: getAgentConversationTurns
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Recorded user and assistant turns for a conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConversationTurns"
  /agent/conversations/{conversationId}/pending-confirmations:
    get:
      operationId: getAgentPendingConfirmations
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pending confirmation plans for a conversation with fresh recovery tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPendingConfirmations"
  /execution-plans/{id}/confirm:
    post:
      operationId: confirmExecutionPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmExecutionPlanRequest"
      responses:
        "200":
          description: Execution result after confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTurnResponse"
  /execution-plans/{id}/reject:
    post:
      operationId: rejectExecutionPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected execution plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionPlan"
  /execution-plans/{id}:
    get:
      operationId: getExecutionPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Execution plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionPlan"
  /execution-ledger:
    get:
      operationId: getExecutionLedger
      parameters:
        - name: conversationId
          in: query
          required: false
          description: 仅返回指定会话产生的执行记录；不传时返回全局列表。
          schema:
            type: string
      responses:
        "200":
          description: Execution ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionLedgerItem"
  /calendar/events:
    get:
      operationId: getCalendarEvents
      parameters:
        - name: conversationId
          in: query
          required: false
          description: 仅返回指定会话确认写入的日程；不传时返回全局列表。
          schema:
            type: string
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
  /calendar/events/{id}/cancel:
    post:
      operationId: cancelCalendarEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          required: true
          description: 直接 UI 取消的会话归属；后端会校验目标日程属于该会话并写入执行流水。
          schema:
            type: string
      responses:
        "200":
          description: Canceled calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
  /calendar/events/{id}:
    patch:
      operationId: updateCalendarEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          required: true
          description: 直接 UI 编辑的会话归属；后端会校验目标日程属于该会话并写入执行流水。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventUpdate"
      responses:
        "200":
          description: Updated calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
  /expenses:
    get:
      operationId: getExpenses
      parameters:
        - name: conversationId
          in: query
          required: false
          description: 仅返回指定会话确认写入的费用记录；不传时返回全局列表。
          schema:
            type: string
      responses:
        "200":
          description: Expense records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseRecord"
  /expenses/{id}/submit:
    post:
      operationId: submitExpense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          required: true
          description: 直接 UI 提交的会话归属；后端会校验目标费用属于该会话并写入执行流水。
          schema:
            type: string
      responses:
        "200":
          description: Submitted expense draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRecord"
  /expenses/{id}:
    patch:
      operationId: updateExpense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          required: true
          description: 直接 UI 编辑的会话归属；后端会校验目标费用属于该会话并写入执行流水。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRecordUpdate"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRecord"
  /expenses/{id}/cancel:
    post:
      operationId: cancelExpense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          required: true
          description: 直接 UI 取消的会话归属；后端会校验目标费用属于该会话并写入执行流水。
          schema:
            type: string
      responses:
        "200":
          description: Canceled expense draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRecord"
  /reminders:
    get:
      operationId: getReminders
      parameters:
        - name: conversationId
          in: query
          required: false
          description: 仅返回指定会话确认写入的提醒；不传时返回全局列表。
          schema:
            type: string
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
  /reminders/{id}:
    patch:
      operationId: updateReminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          required: true
          description: 直接 UI 编辑的会话归属；后端会校验目标提醒属于该会话并写入执行流水。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdate"
      responses:
        "200":
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /reminders/{id}/complete:
    post:
      operationId: completeReminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          required: true
          description: 直接 UI 完成的会话归属；后端会校验目标提醒属于该会话并写入执行流水。
          schema:
            type: string
      responses:
        "200":
          description: Completed reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /reminders/{id}/cancel:
    post:
      operationId: cancelReminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          required: true
          description: 直接 UI 取消的会话归属；后端会校验目标提醒属于该会话并写入执行流水。
          schema:
            type: string
      responses:
        "200":
          description: Canceled reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /version:
    get:
      operationId: getVersion
      responses:
        "200":
          description: Service version
          content:
            application/json:
              schema:
                type: object
                required: [name, version]
                properties:
                  name:
                    type: string
                  version:
                    type: string
components:
  schemas:
    FactoryCapability:
      type: object
      required: [id, label, status, source, summary]
      properties:
        id:
          type: string
          examples: [contracts]
        label:
          type: string
          examples: [Contract-first API]
        source:
          type: string
          examples: [contracts/openapi/api-gateway.yaml]
        status:
          type: string
          enum: [ready, planned]
        summary:
          type: string
          example: HTTP API shape is declared before runtime consumers use it.
    FactoryStatus:
      type: object
      required: [name, status, version, capabilities, nextActions]
      properties:
        name:
          type: string
          examples: [AI Code Factory]
        status:
          type: string
          enum: [ready, degraded]
        version:
          type: string
          examples: [0.1.0]
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/FactoryCapability"
        nextActions:
          type: array
          items:
            type: string
    AgentTurnRequest:
      type: object
      required: [input]
      properties:
        conversationId:
          type: string
        displayInput:
          type: string
          description: Optional user-facing text to store in conversation history when input carries an internal stable value.
        input:
          type: string
        clientContext:
          type: object
    ConfirmExecutionPlanRequest:
      type: object
      required: [confirmToken]
      properties:
        confirmToken:
          type: string
        actionIds:
          type: array
          items:
            type: string
    AttachmentIntakeRequest:
      type: object
      required: [attachmentId, attachmentKind, attachmentName]
      properties:
        attachmentId:
          type: string
        attachmentKind:
          type: string
        attachmentName:
          type: string
        attachmentSizeBytes:
          type: integer
        attachmentType:
          type: string
        conversationId:
          type: string
        source:
          type: string
        text:
          type: string
    AttachmentUploadRequest:
      type: object
      required: [attachmentId, attachmentKind, attachmentName, base64Content]
      properties:
        attachmentId:
          type: string
        attachmentKind:
          type: string
        attachmentName:
          type: string
        attachmentType:
          type: string
        base64Content:
          type: string
          description: Base64-encoded attachment bytes. Current backend limit is 5MB decoded.
        conversationId:
          type: string
        source:
          type: string
        text:
          type: string
          description: Optional caller-provided readable text. If omitted for text files, backend decodes UTF-8 text.
    AttachmentIntake:
      type: object
      required: [id, attachmentId, kind, name, status, createdAt]
      properties:
        id:
          type: string
        attachmentId:
          type: string
        conversationId:
          type: string
        kind:
          type: string
        name:
          type: string
        sizeBytes:
          type: integer
        source:
          type: string
        status:
          type: string
          enum: [received]
        contentSha256:
          type: string
        contentStatus:
          type: string
          enum: [content_received]
        text:
          type: string
        type:
          type: string
        createdAt:
          type: string
    DomainAction:
      type: object
      required: [id, planId, domain, actionType, status, riskLevel, summary, payload]
      properties:
        id:
          type: string
        planId:
          type: string
        domain:
          type: string
          enum: [calendar, expense, reminder]
        actionType:
          type: string
          enum: [calendar.cancel_event, calendar.create_event, calendar.query_events, calendar.update_event, expense.cancel_reimbursement, expense.create_reimbursement_draft, expense.submit_reimbursement, expense.update_reimbursement, reminder.cancel_reminder, reminder.complete_reminder, reminder.create_reminder, reminder.update_reminder]
        status:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high]
        summary:
          type: string
        payload:
          type: object
        result:
          type: object
    ConfirmationCard:
      type: object
      required: [id, planId, status, requiredActionIds, title, description, confirmToken]
      properties:
        id:
          type: string
        planId:
          type: string
        status:
          type: string
        requiredActionIds:
          type: array
          items:
            type: string
        title:
          type: string
        description:
          type: string
        confirmToken:
          type: string
    ExecutionPlan:
      type: object
      required: [id, conversationId, status, riskLevel, summary, decisionTraceId, actions]
      properties:
        id:
          type: string
        conversationId:
          type: string
        status:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high]
        summary:
          type: string
        decisionTraceId:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/DomainAction"
        confirmation:
          $ref: "#/components/schemas/ConfirmationCard"
    AgentTurnResponse:
      type: object
      required: [kind, conversationId]
      properties:
        kind:
          type: string
          enum: [assistant_message, clarification_request, confirmation_required, execution_result]
        conversationId:
          type: string
        message:
          type: string
        question:
          type: string
        clarificationId:
          type: string
        missingFields:
          type: array
          items:
            type: string
        quickReplies:
          type: array
          items:
            type: string
        quickReplyOptions:
          type: array
          items:
            $ref: "#/components/schemas/QuickReplyOption"
        plan:
          $ref: "#/components/schemas/ExecutionPlan"
        structuredElements:
          type: array
          items:
            type: object
    QuickReplyOption:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
    AgentDebugEvent:
      type: object
      required: [id, eventType, payload]
      properties:
        id:
          type: string
        eventType:
          type: string
        turnId:
          type: string
          nullable: true
        planId:
          type: string
          nullable: true
        traceId:
          type: string
          nullable: true
        payload:
          type: object
    AgentDebugDecisionTrace:
      type: object
      required:
        - id
        - plannerMode
        - contextSectionsUsed
        - toolsConsidered
        - toolsSelected
        - missingInformation
        - policyDecisions
        - reasoningSummary
      properties:
        id:
          type: string
        plannerMode:
          type: string
        contextSectionsUsed:
          type: array
          items:
            type: string
        toolsConsidered:
          type: array
          items:
            type: string
        toolsSelected:
          type: array
          items:
            type: string
        missingInformation:
          type: array
          items:
            type: string
        policyDecisions:
          type: array
          items:
            type: string
        confirmationReason:
          type: string
          nullable: true
        fallbackReason:
          type: string
          nullable: true
        reasoningSummary:
          type: array
          items:
            type: string
        llmCall:
          type: object
          nullable: true
          properties:
            provider:
              type: string
            model:
              type: string
            mode:
              type: string
            status:
              type: string
            durationMs:
              type: number
            promptChars:
              type: number
            responseChars:
              type: number
            promptSha256:
              type: string
            errorType:
              type: string
            promptPreview:
              type: string
            responsePreview:
              type: string
    AgentDebugPendingClarification:
      type: object
      required:
        - id
        - domain
        - actionType
        - question
        - missingFields
        - partialPayload
        - quickReplies
        - status
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
        domain:
          type: string
        actionType:
          type: string
          enum: [calendar.cancel_event, calendar.create_event, calendar.query_events, calendar.update_event, expense.cancel_reimbursement, expense.create_reimbursement_draft, expense.submit_reimbursement, expense.update_reimbursement, reminder.cancel_reminder, reminder.complete_reminder, reminder.create_reminder, reminder.update_reminder]
        question:
          type: string
        missingFields:
          type: array
          items:
            type: string
        partialPayload:
          type: object
        quickReplies:
          type: array
          items:
            type: string
        quickReplyOptions:
          type: array
          items:
            $ref: "#/components/schemas/QuickReplyOption"
        status:
          type: string
        createdAt:
          type: string
        expiresAt:
          type: string
        resolvedAt:
          type: string
          nullable: true
    AgentConversationDebug:
      type: object
      required: [conversationId, events, decisionTraces, pendingClarifications]
      properties:
        conversationId:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentDebugEvent"
        decisionTraces:
          type: array
          items:
            $ref: "#/components/schemas/AgentDebugDecisionTrace"
        pendingClarifications:
          type: array
          items:
            $ref: "#/components/schemas/AgentDebugPendingClarification"
    AgentConversationTurn:
      type: object
      required: [id, role, summary, createdAt]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [assistant, system, user]
        summary:
          type: string
        inputText:
          type: string
          nullable: true
        rawContent:
          type: object
          nullable: true
        structuredResponse:
          allOf:
            - $ref: "#/components/schemas/AgentTurnResponse"
          nullable: true
        createdAt:
          type: string
    AgentConversationTurns:
      type: object
      required: [conversationId, turns]
      properties:
        conversationId:
          type: string
        turns:
          type: array
          items:
            $ref: "#/components/schemas/AgentConversationTurn"
    AgentPendingConfirmations:
      type: object
      required: [conversationId, plans]
      properties:
        conversationId:
          type: string
        plans:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionPlan"
    ExecutionLedgerItem:
      type: object
      required: [id, planId, eventType, status, message, createdAt]
      properties:
        id:
          type: string
        planId:
          type: string
        actionId:
          type: string
        eventType:
          type: string
        status:
          type: string
        message:
          type: string
        createdAt:
          type: string
    CalendarEvent:
      type: object
      required: [id, title, startAt, endAt, timezone, status, sourceActionId]
      properties:
        id:
          type: string
        title:
          type: string
        startAt:
          type: string
        endAt:
          type: string
        timezone:
          type: string
        status:
          type: string
          enum: [scheduled, canceled]
        sourceActionId:
          type: string
    CalendarEventUpdate:
      type: object
      properties:
        title:
          type: string
        startAt:
          type: string
        endAt:
          type: string
        timezone:
          type: string
    ExpenseRecord:
      type: object
      required: [id, title, currency, status, sourceActionId]
      properties:
        id:
          type: string
        title:
          type: string
        amount:
          type: number
        currency:
          type: string
        occurredOn:
          type: string
        status:
          type: string
          enum: [draft, submitted, canceled]
        sourceActionId:
          type: string
    ExpenseRecordUpdate:
      type: object
      properties:
        title:
          type: string
        amount:
          type: number
        currency:
          type: string
        occurredOn:
          type: string
    Reminder:
      type: object
      required: [id, title, dueAt, status, sourceActionId]
      properties:
        id:
          type: string
        title:
          type: string
        dueAt:
          type: string
        status:
          type: string
          enum: [scheduled, done, canceled]
        sourceActionId:
          type: string
    ReminderUpdate:
      type: object
      properties:
        title:
          type: string
        dueAt:
          type: string
